<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- プロモーションムービー用：スマホのホーム画面の見本。アプリのアイコン以外は形だけの無地のアイコン。
     #go を押すと、アイコンが広がってアプリが開くように見せる（make-promo.js が録画する） -->
<style>
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:linear-gradient(170deg,#c9d3da 0%,#d9cfd3 55%,#e7cfd4 100%); font-family:"NSANS","Hiragino Sans",sans-serif; }
  .grid{ position:absolute; left:26px; right:26px; top:70px; display:grid; grid-template-columns:repeat(4,1fr); row-gap:30px; justify-items:center; }
  .app{ width:62px; text-align:center; }
  .ic{ width:62px; height:62px; border-radius:15px; background:rgba(255,255,255,.55); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .lb{ margin-top:6px; height:12px; width:44px; margin-left:auto; margin-right:auto; border-radius:6px; background:rgba(255,255,255,.45); }
  .me .ic{ background:none; box-shadow:0 2px 6px rgba(0,0,0,.15); overflow:hidden; }
  .me .ic img{ width:100%; height:100%; display:block; }
  .me .lb{ width:auto; height:auto; background:none; font-size:11px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); white-space:nowrap; }
  .dock{ position:absolute; left:14px; right:14px; bottom:22px; height:92px; border-radius:30px; background:rgba(255,255,255,.35); display:flex; justify-content:space-around; align-items:center; }
  .dock .ic{ background:rgba(255,255,255,.6); }
  /* アプリが開く：アイコンの位置から画面いっぱいに広がる */
  .open{ position:fixed; background:#fff6f9; border-radius:15px; opacity:0; pointer-events:none;
    transition:left .55s cubic-bezier(.3,.8,.2,1), top .55s cubic-bezier(.3,.8,.2,1), width .55s cubic-bezier(.3,.8,.2,1), height .55s cubic-bezier(.3,.8,.2,1), border-radius .55s ease, opacity .15s ease; }
</style>
</head>
<body>
<div class="grid">
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app me" id="go"><div class="ic"><img id="icon" alt=""></div><div class="lb">AikatsuCalendar</div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
  <div class="app"><div class="ic"></div><div class="lb"></div></div>
</div>
<div class="dock"><div class="ic"></div><div class="ic"></div><div class="ic"></div><div class="ic"></div></div>
<div class="open" id="open"></div>
<script>
  document.getElementById("go").addEventListener("click", function(){
    var r = this.querySelector(".ic").getBoundingClientRect(), o = document.getElementById("open");
    Object.assign(o.style, { left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px" });
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      Object.assign(o.style, { opacity:1, left:"0px", top:"0px", width:innerWidth+"px", height:innerHeight+"px", borderRadius:"0px" });
    }); });
  });
</script>
</body>
</html>
