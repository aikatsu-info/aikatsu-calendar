<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- プロモーションムービー（縦長 1080×1920）の各場面の背景。make-promo.js が1場面ずつ画像にし、
     スマホ枠の画面（.screen）の位置に操作の録画を重ねる。文言はここで変える。
     見た目はカレンダー本体に合わせる：見出しは明朝・ローズ色、説明はゴシック、ピンクは差し色だけ。 -->
<style>
  :root{
    --surface:#ffffff; --ink:#2a1b28; --ink-soft:#7c6072; --ink-faint:#a98fa0; --line:#f4d9e6;
    --accent:#e0176c; --accent-soft:#ffe1ee; --rose:#8a4a66;
    --font-mincho:"NSJ","Hiragino Mincho ProN",serif;
    --font-gothic:"NSANS","Hiragino Sans",sans-serif;
  }
  body{ margin:0; padding:20px; background:#ccc; display:flex; flex-wrap:wrap; gap:20px; font-family:var(--font-gothic); }
  .scene{
    position:relative; width:1080px; height:1920px; overflow:hidden; box-sizing:border-box;
    background:radial-gradient(80% 45% at 0% 0%, var(--accent-soft), transparent 70%),
               radial-gradient(70% 40% at 100% 100%, #fbe3ee, transparent 70%), #fff8fb;
  }
  /* 見出し */
  .cap{ position:absolute; left:0; right:0; top:150px; text-align:center; }
  .time{ font-family:var(--font-mincho); font-size:30px; letter-spacing:.32em; color:var(--accent); }
  .time b{ font-weight:500; margin-left:.6em; letter-spacing:.12em; color:var(--rose); }
  .h{ margin:34px 0 0; font-family:var(--font-mincho); font-weight:500; font-size:66px; line-height:1.45; letter-spacing:.1em; color:var(--rose); }
  .h::after{ content:""; display:block; width:70px; height:3px; margin:34px auto 0; background:var(--accent); }
  .sub{ margin:28px 0 0; font-size:32px; letter-spacing:.08em; color:var(--ink-soft); }
  /* スマホ枠（下は切り落とす） */
  .phone{
    position:absolute; left:50%; top:720px; width:600px; margin-left:-316px; padding:16px; border-radius:84px; background:#fff;
    box-shadow:0 0 0 2px var(--line), 0 40px 80px -36px rgba(224,23,108,.45);
  }
  .screen{ position:relative; border-radius:68px; overflow:hidden; background:#fff6f9; height:1400px; }
  .status{ height:62px; display:flex; align-items:center; justify-content:space-between; padding:0 50px 0 58px;
    font:700 26px/1 -apple-system,"Helvetica Neue",Arial,sans-serif; color:#222; background:#fff; }
  .island{ position:absolute; top:16px; left:50%; width:170px; height:44px; margin-left:-85px; border-radius:24px; background:#111; }
  .icons{ display:flex; gap:8px; align-items:center; }
  .icons i{ display:block; background:#222; border-radius:2px; }
  .rec{ position:absolute; left:0; right:0; top:62px; bottom:0; } /* ここに録画を重ねる */
  /* はじめ・おわり */
  .center{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; }
  .en{ font-family:var(--font-mincho); font-weight:500; font-size:62px; letter-spacing:.14em; color:var(--ink); white-space:nowrap; }
  .ja{ display:flex; align-items:center; justify-content:center; gap:26px; margin-top:28px; font-size:34px; letter-spacing:.14em; color:var(--ink-soft); }
  .ja::before,.ja::after{ content:""; width:80px; height:2px; background:var(--accent); opacity:.6; }
  .lead{ font-family:var(--font-mincho); font-weight:500; font-size:60px; line-height:1.6; letter-spacing:.12em; color:var(--rose); }
  .lead small{ display:block; margin-top:36px; font-family:var(--font-gothic); font-size:30px; letter-spacing:.3em; color:var(--accent); }
  .appicon{ width:190px; height:190px; border-radius:44px; margin:0 auto 60px; box-shadow:0 18px 40px -16px rgba(224,23,108,.45); overflow:hidden; }
  .appicon img{ width:100%; height:100%; display:block; }
  .url{ margin-top:70px; font-size:32px; letter-spacing:.04em; color:var(--ink-soft); }
  .note{ margin-top:22px; font-size:28px; letter-spacing:.08em; color:var(--ink-faint); }
</style>
</head>
<body>

<!-- はじめ -->
<section class="scene" id="op">
  <div class="center"><div class="lead">アイカツ！のある、<br>いつもの一日。<small>AIKATSU! CALENDAR</small></div></div>
</section>

<!-- 朝：ホーム画面から開いて、今日の誕生日 -->
<section class="scene" id="morning" data-time="7:30">
  <div class="cap"><div class="time">MORNING<b>7:30</b></div><h2 class="h">今日は、誰の誕生日？</h2><p class="sub">ホーム画面から、すぐにチェック</p></div>
  <div class="phone"><div class="screen"><div class="status">7:30<span class="island"></span><span class="icons"><i style="width:30px;height:17px"></i><i style="width:44px;height:21px;border-radius:6px"></i></span></div><div class="rec"></div></div></div>
</section>

<!-- 昼：新着のトピックス -->
<section class="scene" id="noon" data-time="12:30">
  <div class="cap"><div class="time">LUNCH<b>12:30</b></div><h2 class="h">新しいグッズ、出てる？</h2><p class="sub">新着順のトピックスで</p></div>
  <div class="phone"><div class="screen"><div class="status">12:30<span class="island"></span><span class="icons"><i style="width:30px;height:17px"></i><i style="width:44px;height:21px;border-radius:6px"></i></span></div><div class="rec"></div></div></div>
</section>

<!-- 夜：今週の予定をカレンダーに追加 -->
<section class="scene" id="night" data-time="21:00">
  <div class="cap"><div class="time">NIGHT<b>21:00</b></div><h2 class="h">今週の予定を、<br>私のカレンダーに</h2></div>
  <div class="phone"><div class="screen"><div class="status">21:00<span class="island"></span><span class="icons"><i style="width:30px;height:17px"></i><i style="width:44px;height:21px;border-radius:6px"></i></span></div><div class="rec"></div></div></div>
</section>

<!-- おわり -->
<section class="scene" id="ed">
  <div class="center">
    <div class="appicon"><img data-icon alt=""></div>
    <div class="en">AIKATSU! CALENDAR</div>
    <div class="ja">アイカツ！情報カレンダー</div>
    <div class="url">aikatsu-info.github.io/aikatsu-calendar</div>
    <div class="note">ホーム画面に追加して、アプリのように</div>
  </div>
</section>

</body>
</html>
